<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contour Webcam Y2K Holographique Extra-Large</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
        }
        
        .webcam-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .webcam-frame {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .webcam-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100% - 240px); /* Bordure beaucoup plus large */
            height: calc(100% - 240px);
            background-color: transparent;
            z-index: 10;
        }
        
        .border-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .filament {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
            transform-origin: center;
            border-radius: 2px;
        }
        
        .glow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: blur(20px);
            opacity: 0.95; /* Encore plus lumineux */
            mix-blend-mode: screen;
            pointer-events: none;
        }
        
        .holographic-edge {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            border: 120px solid transparent; /* Bordure beaucoup plus large */
            box-shadow: 
                inset 0 0 50px rgba(255, 255, 255, 0.9),
                0 0 50px rgba(255, 255, 255, 0.8);
            z-index: 5;
            pointer-events: none;
        }
        
        .holographic-edge::before {
            content: '';
            position: absolute;
            top: -120px;
            left: -120px;
            right: -120px;
            bottom: -120px;
            background: linear-gradient(45deg, 
                rgba(255, 0, 255, 0.9), 
                rgba(0, 255, 255, 0.9), 
                rgba(255, 0, 255, 0.9), 
                rgba(0, 255, 255, 0.9));
            background-size: 400% 400%;
            z-index: -1;
            animation: gradientShift 8s linear infinite;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: source-out;
            filter: blur(3px);
        }
        
        /* Double contour pour plus de visibilité */
        .outer-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 125px solid transparent;
            box-shadow: 
                0 0 60px rgba(255, 0, 255, 0.9),
                0 0 100px rgba(0, 255, 255, 0.8);
            z-index: 4;
            pointer-events: none;
            animation: pulseGlow 3s ease-in-out infinite;
        }
        
        /* Second contour extérieur pour effet de profondeur */
        .outer-glow-2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 130px solid transparent;
            box-shadow: 
                0 0 70px rgba(255, 51, 153, 0.8),
                0 0 120px rgba(0, 255, 204, 0.7);
            z-index: 3;
            pointer-events: none;
            animation: pulseGlow2 4s ease-in-out infinite;
        }
        
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 0.7; }
        }
        
        @keyframes pulseGlow2 {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.9; }
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Lignes néon plus larges et plus visibles */
        .neon-line {
            position: absolute;
            background: linear-gradient(90deg, 
                rgba(255, 0, 255, 0), 
                rgba(255, 0, 255, 1), 
                rgba(255, 0, 255, 0));
            filter: blur(3px);
            z-index: 6;
            animation: neonPulse 2s ease-in-out infinite;
        }
        
        @keyframes neonPulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }
    </style>
</head>

ound: linear-gradient(0deg, rgba(0, 255, 255, 0), rgb(0, 255, 255), rgba(0, 255, 255, 0)); box-shadow: rgb(0, 255, 204) 0px 0px 25px, rgb(0, 255, 204) 0px 0px 50px;"></div><div class="filament" style="width: 2084.72px; height: 8px; top: 50%; left: 50%; transform-origin: center center 0px; transform: translate(-50%, -50%) rotate(30deg); opacity: 0.8; background: linear-gradient(90deg, transparent, rgb(255, 51, 153), transparent); box-shadow: rgb(255, 51, 153) 0px 0px 20px;"></div><div class="filament" style="width: 2084.72px; height: 8px; top: 50%; left: 50%; transform-origin: center center 0px; transform: translate(-50%, -50%) rotate(45deg); opacity: 0.8; background: linear-gradient(90deg, transparent, rgb(51, 204, 255), transparent); box-shadow: rgb(51, 204, 255) 0px 0px 20px;"></div><div class="filament" style="width: 2084.72px; height: 8px; top: 50%; left: 50%; transform-origin: center center 0px; transform: translate(-50%, -50%) rotate(60deg); opacity: 0.8; background: linear-gradient(90deg, transparent, rgb(255, 0, 102), transparent); box-shadow: rgb(255, 0, 102) 0px 0px 20px;"></div><div class="filament" style="width: 2084.72px; height: 8px; top: 50%; left: 50%; transform-origin: center center 0px; transform: translate(-50%, -50%) rotate(75deg); opacity: 0.8; background: linear-gradient(90deg, transparent, rgb(255, 51, 153), transparent); box-shadow: rgb(255, 51, 153) 0px 0px 20px;"></div><div class="filament" style="width: 2084.72px; height: 8px; top: 50%; left: 50%; transform-origin: center center 0px; transform: translate(-50%, -50%) rotate(90deg); opacity: 0.8; background: linear-gradient(90deg, transparent, rgb(255, 0, 255), transparent); box-shadow: rgb(255, 0, 255) 0px 0px 20px;"></div><div class="filament" style="width: 2084.72px; height: 8px; top: 50%; left: 50%; transform-origin: center center 0px; transform: translate(-50%, -50%) rotate(105deg); opacity: 0.8; background: linear-gradient(90deg, transparent, rgb(255, 0, 102), transparent); box-shadow: rgb(255, 0, 102) 0px 0px 20px;"></div><div class="filament" style="width: 2084.72px; height: 8px; top: 50%; left: 50%; transform-origin: center center 0px; transform: translate(-50%, -50%) rotate(120deg); opacity: 0.8; background: linear-gradient(90deg, transparent, rgb(153, 102, 255), transparent); box-shadow: rgb(153, 102, 255) 0px 0px 20px;"></div><div class="filament" style="width: 2084.72px; height: 8px; top: 50%; left: 50%; transform-origin: center center 0px; transform: translate(-50%, -50%) rotate(135deg); opacity: 0.8; background: linear-gradient(90deg, transparent, rgb(51, 204, 255), transparent); box-shadow: rgb(51, 204, 255) 0px 0px 20px;"></div><div class="filament" style="width: 2084.72px; height: 8px; top: 50%; left: 50%; transform-origin: center center 0px; transform: translate(-50%, -50%) rotate(150deg); opacity: 0.8; background: linear-gradient(90deg, transparent, rgb(0, 204, 255), transparent); box-shadow: rgb(0, 204, 255) 0px 0px 20px;"></div><div class="filament" style="width: 2084.72px; height: 8px; top: 50%; left: 50%; transform-origin: center center 0px; transform: translate(-50%, -50%) rotate(165deg); opacity: 0.8; background: linear-gradient(90deg, transparent, rgb(51, 204, 255), transparent); box-shadow: rgb(51, 204, 255) 0px 0px 20px;"></div><div class="filament" style="width: 2084.72px; height: 8px; top: 50%; left: 50%; transform-origin: center center 0px; transform: translate(-50%, -50%) rotate(180deg); opacity: 0.8; background: linear-gradient(90deg, transparent, rgb(255, 102, 204), transparent); box-shadow: rgb(255, 102, 204) 0px 0px 20px;"></div><div class="filament" style="width: 2084.72px; height: 8px; top: 50%; left: 50%; transform-origin: center center 0px; transform: translate(-50%, -50%) rotate(195deg); opacity: 0.8; background: linear-gradient(90deg, transparent, rgb(153, 102, 255), transparent); box-shadow: rgb(153, 102, 255) 0px 0px 20px;"></div><div style="position: absolute; top: 0px; left: 0px; width: 100%; height: 100%; pointer-events: none; z-index: 7; background: transparent; box-shadow: rgba(255, 255, 255, 0) 0px 0px 70px inset;"></div><div style="position: absolute; opacity: 0.4; background: linear-gradient(90deg, rgba(255, 0, 255, 0.3), rgba(0, 255, 255, 0.7), rgba(255, 0, 255, 0.3)); box-shadow: rgba(255, 255, 255, 0.5) 0px 0px 30px; z-index: 2; width: 100%; height: 60px; left: 0px; top: 0px;"></div><div style="position: absolute; opacity: 0.4; background: linear-gradient(0deg, rgba(255, 0, 255, 0.3), rgba(0, 255, 255, 0.7), rgba(255, 0, 255, 0.3)); box-shadow: rgba(255, 255, 255, 0.5) 0px 0px 30px; z-index: 2; height: 100%; width: 60px; top: 0px; right: 0px;"></div><div style="position: absolute; opacity: 0.4; background: linear-gradient(90deg, rgba(255, 0, 255, 0.3), rgba(0, 255, 255, 0.7), rgba(255, 0, 255, 0.3)); box-shadow: rgba(255, 255, 255, 0.5) 0px 0px 30px; z-index: 2; width: 100%; height: 60px; left: 0px; bottom: 0px;"></div><div style="position: absolute; opacity: 0.4; background: linear-gradient(0deg, rgba(255, 0, 255, 0.3), rgba(0, 255, 255, 0.7), rgba(255, 0, 255, 0.3)); box-shadow: rgba(255, 255, 255, 0.5) 0px 0px 30px; z-index: 2; height: 100%; width: 60px; top: 0px; left: 0px;"></div></div>
            <div class="webcam-center"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const borderEffect = document.getElementById('borderEffect');
            const glowContainer = document.getElementById('glowContainer');
            const neonLines = document.getElementById('neonLines');
            const filamentCount = 120; // Encore plus de filaments
            const colors = [
                '#ff00ff', // Magenta
                '#00ffff', // Cyan
                '#ff66cc', // Pink
                '#9966ff', // Purple
                '#33ccff', // Blue
                '#ff3399', // Hot pink
                '#00ffcc', // Turquoise
                '#ff0066', // Bright pink
                '#00ccff'  // Bright blue
            ];
            
            // Créer les filaments animés
            for (let i = 0; i < filamentCount; i++) {
                createFilament(borderEffect, i, false);
                createFilament(glowContainer, i, true);
            }
            
            function createFilament(container, index, isGlow) {
                const filament = document.createElement('div');
                filament.className = 'filament';
                
                // Paramètres ultra-visibles pour chaque filament
                const length = Math.random() * 300 + 250; // Encore plus longs
                const thickness = Math.random() * 8 + (isGlow ? 15 : 6); // Beaucoup plus épais
                const startPosition = Math.random() * 100;
                const speed = Math.random() * 7 + 10;
                const delay = Math.random() * 10;
                const colorIndex = Math.floor(Math.random() * colors.length);
                const opacity = isGlow ? 0.9 : Math.random() * 0.7 + 0.6; // Encore plus visible
                
                // Déterminer si le filament est horizontal ou vertical
                const isHorizontal = Math.random() > 0.5;
                
                // Positionner le filament sur les bords
                if (isHorizontal) {
                    const isTop = Math.random() > 0.5;
                    filament.style.width = `${length}px`;
                    filament.style.height = `${thickness}px`;
                    filament.style.top = isTop ? '0' : 'calc(100% - ' + thickness + 'px)';
                    filament.style.left = `${startPosition}%`;
                    
                    // Animation pour les filaments horizontaux
                    filament.animate([
                        { left: `${startPosition}%`, opacity: opacity },
                        { left: `${startPosition + 100}%`, opacity: opacity }
                    ], {
                        duration: speed * 1000,
                        delay: delay * 1000,
                        iterations: Infinity,
                        easing: 'linear'
                    });
                } else {
                    const isLeft = Math.random() > 0.5;
                    filament.style.width = `${thickness}px`;
                    filament.style.height = `${length}px`;
                    filament.style.left = isLeft ? '0' : 'calc(100% - ' + thickness + 'px)';
                    filament.style.top = `${startPosition}%`;
                    
                    // Animation pour les filaments verticaux
                    filament.animate([
                        { top: `${startPosition}%`, opacity: opacity },
                        { top: `${startPosition + 100}%`, opacity: opacity }
                    ], {
                        duration: speed * 1000,
                        delay: delay * 1000,
                        iterations: Infinity,
                        easing: 'linear'
                    });
                }
                
                // Appliquer la couleur et l'effet holographique ultra-visible
                filament.style.background = `linear-gradient(${isHorizontal ? '90deg' : '0deg'}, 
                    transparent, 
                    ${colors[colorIndex]}${isGlow ? 'ff' : 'ff'}, 
                    transparent)`;
                filament.style.boxShadow = `0 0 ${isGlow ? '25' : '15'}px ${colors[colorIndex]}`;
                filament.style.opacity = opacity;
                
                container.appendChild(filament);
            }
            
            // Créer des filaments d'angle pour les coins avec encore plus d'intensité
            for (let i = 0; i < 50; i++) { // Encore plus de filaments d'angle
                createCornerFilament(borderEffect);
                createCornerFilament(glowContainer, true);
            }
            
            function createCornerFilament(container, isGlow = false) {
                const filament = document.createElement('div');
                filament.className = 'filament';
                
                // Paramètres ultra-visibles pour les filaments d'angle
                const length = Math.random() * 300 + 150; // Encore plus longs
                const thickness = Math.random() * 8 + (isGlow ? 12 : 5); // Beaucoup plus épais
                const colorIndex = Math.floor(Math.random() * colors.length);
                const opacity = isGlow ? 0.8 : Math.random() * 0.7 + 0.6; // Encore plus visible
                
                // Choisir un coin aléatoirement
                const corner = Math.floor(Math.random() * 4);
                let top, left, angle;
                
                switch (corner) {
                    case 0: // Coin supérieur gauche
                        top = 0;
                        left = 0;
                        angle = Math.random() * 45;
                        break;
                    case 1: // Coin supérieur droit
                        top = 0;
                        left = '100%';
                        angle = Math.random() * 45 + 135;
                        break;
                    case 2: // Coin inférieur droit
                        top = '100%';
                        left = '100%';
                        angle = Math.random() * 45 + 225;
                        break;
                    case 3: // Coin inférieur gauche
                        top = '100%';
                        left = 0;
                        angle = Math.random() * 45 + 315;
                        break;
                }
                
                filament.style.width = `${length}px`;
                filament.style.height = `${thickness}px`;
                filament.style.top = typeof top === 'number' ? `${top}px` : top;
                filament.style.left = typeof left === 'number' ? `${left}px` : left;
                filament.style.transformOrigin = corner === 0 ? 'left top' : 
                                               corner === 1 ? 'right top' : 
                                               corner === 2 ? 'right bottom' : 'left bottom';
                filament.style.transform = `rotate(${angle}deg)`;
                
                // Appliquer la couleur et l'effet holographique ultra-visible
                filament.style.background = `linear-gradient(90deg, 
                    transparent, 
                    ${colors[colorIndex]}${isGlow ? 'ff' : 'ff'}, 
                    transparent)`;
                filament.style.boxShadow = `0 0 ${isGlow ? '25' : '15'}px ${colors[colorIndex]}`;
                filament.style.opacity = opacity;
                
                // Animation de pulsation ultra-visible
                filament.animate([
                    { opacity: opacity, boxShadow: `0 0 ${isGlow ? '25' : '15'}px ${colors[colorIndex]}` },
                    { opacity: opacity * 0.8, boxShadow: `0 0 ${isGlow ? '15' : '8'}px ${colors[colorIndex]}` },
                    { opacity: opacity, boxShadow: `0 0 ${isGlow ? '25' : '15'}px ${colors[colorIndex]}` }
                ], {
                    duration: (Math.random() * 3000) + 1500,
                    iterations: Infinity,
                    easing: 'ease-in-out'
                });
                
                container.appendChild(filament);
            }
            
            // Ajouter des lignes néon ultra-visibles et plus épaisses sur les bords
            createNeonLines();
            
            function createNeonLines() {
                // Créer 8 lignes néon (2 par côté pour plus d'intensité)
                const positions = ['top', 'right', 'bottom', 'left', 'top', 'right', 'bottom', 'left'];
                const neonColors = ['#ff00ff', '#00ffff', '#ff3399', '#00ffcc', '#ff66cc', '#33ccff', '#ff0066', '#00ccff'];
                
                positions.forEach((position, index) => {
                    const neon = document.createElement('div');
                    neon.className = 'neon-line';
                    
                    // Configurer la position et la taille (beaucoup plus large)
                    if (position === 'top' || position === 'bottom') {
                        neon.style.width = '100%';
                        neon.style.height = '8px'; // Beaucoup plus épais
                        neon.style.left = '0';
                        neon.style[position] = index < 4 ? '0' : '15px'; // Décalage pour le second ensemble
                    } else {
                        neon.style.height = '100%';
                        neon.style.width = '8px'; // Beaucoup plus épais
                        neon.style.top = '0';
                        neon.style[position] = index < 4 ? '0' : '15px'; // Décalage pour le second ensemble
                        neon.style.background = `linear-gradient(0deg, 
                            rgba(${position === 'left' ? '255, 0, 255' : '0, 255, 255'}, 0), 
                            rgba(${position === 'left' ? '255, 0, 255' : '0, 255, 255'}, 1), 
                            rgba(${position === 'left' ? '255, 0, 255' : '0, 255, 255'}, 0))`;
                    }
                    
                    // Appliquer la couleur et l'effet (plus intense)
                    if (position === 'top' || position === 'bottom') {
                        neon.style.background = `linear-gradient(90deg, 
                            rgba(${position === 'top' ? '255, 0, 255' : '0, 255, 255'}, 0), 
                            rgba(${position === 'top' ? '255, 0, 255' : '0, 255, 255'}, 1), 
                            rgba(${position === 'top' ? '255, 0, 255' : '0, 255, 255'}, 0))`;
                    }
                    
                    neon.style.boxShadow = `0 0 20px ${neonColors[index]}, 0 0 40px ${neonColors[index]}`;
                    
                    // Animation de déplacement pour un effet plus dynamique (plus rapide)
                    const duration = 6000 + (index * 500); // Vitesses légèrement différentes
                    if (position === 'top' || position === 'bottom') {
                        neon.animate([
                            { left: '-100%' },
                            { left: '100%' }
                        ], {
                            duration: duration,
                            iterations: Infinity,
                            easing: 'linear'
                        });
                    } else {
                        neon.animate([
                            { top: '-100%' },
                            { top: '100%' }
                        ], {
                            duration: duration,
                            iterations: Infinity,
                            easing: 'linear'
                        });
                    }
                    
                    neonLines.appendChild(neon);
                });
                
                // Ajouter des lignes néon supplémentaires pour plus d'épaisseur
                positions.forEach((position, index) => {
                    const neon = document.createElement('div');
                    neon.className = 'neon-line';
                    
                    // Configurer la position et la taille (encore plus large)
                    if (position === 'top' || position === 'bottom') {
                        neon.style.width = '100%';
                        neon.style.height = '12px'; // Encore plus épais
                        neon.style.left = '0';
                        neon.style[position] = index < 4 ? '30px' : '45px'; // Plus à l'intérieur
                    } else {
                        neon.style.height = '100%';
                        neon.style.width = '12px'; // Encore plus épais
                        neon.style.top = '0';
                        neon.style[position] = index < 4 ? '30px' : '45px'; // Plus à l'intérieur
                        neon.style.background = `linear-gradient(0deg, 
                            rgba(${position === 'left' ? '0, 255, 255' : '255, 0, 255'}, 0), 
                            rgba(${position === 'left' ? '0, 255, 255' : '255, 0, 255'}, 1), 
                            rgba(${position === 'left' ? '0, 255, 255' : '255, 0, 255'}, 0))`;
                    }
                    
                    // Appliquer la couleur et l'effet (plus intense)
                    if (position === 'top' || position === 'bottom') {
                        neon.style.background = `linear-gradient(90deg, 
                            rgba(${position === 'top' ? '0, 255, 255' : '255, 0, 255'}, 0), 
                            rgba(${position === 'top' ? '0, 255, 255' : '255, 0, 255'}, 1), 
                            rgba(${position === 'top' ? '0, 255, 255' : '255, 0, 255'}, 0))`;
                    }
                    
                    neon.style.boxShadow = `0 0 25px ${neonColors[(index + 4) % 8]}, 0 0 50px ${neonColors[(index + 4) % 8]}`;
                    
                    // Animation de déplacement dans le sens opposé
                    const duration = 7000 + (index * 500);
                    if (position === 'top' || position === 'bottom') {
                        neon.animate([
                            { left: '100%' },
                            { left: '-100%' }
                        ], {
                            duration: duration,
                            iterations: Infinity,
                            easing: 'linear'
                        });
                    } else {
                        neon.animate([
                            { top: '100%' },
                            { top: '-100%' }
                        ], {
                            duration: duration,
                            iterations: Infinity,
                            easing: 'linear'
                        });
                    }
                    
                    neonLines.appendChild(neon);
                });
            }
            
            // Ajouter des lignes diagonales plus épaisses pour un effet encore plus visible
            createDiagonalLines();
            
            function createDiagonalLines() {
                for (let i = 0; i < 12; i++) {
                    const diagonal = document.createElement('div');
                    diagonal.className = 'filament';
                    
                    // Paramètres pour les lignes diagonales (plus épaisses)
                    const thickness = 8; // Beaucoup plus épais
                    const length = Math.sqrt(Math.pow(window.innerWidth, 2) + Math.pow(window.innerHeight, 2));
                    const colorIndex = Math.floor(Math.random() * colors.length);
                    const angle = 30 + (i * 15); // Répartir les angles
                    
                    diagonal.style.width = `${length}px`;
                    diagonal.style.height = `${thickness}px`;
                    diagonal.style.top = '50%';
                    diagonal.style.left = '50%';
                    diagonal.style.transformOrigin = 'center';
                    diagonal.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
                    diagonal.style.opacity = '0.8';
                    
                    // Appliquer la couleur et l'effet
                    diagonal.style.background = `linear-gradient(90deg, 
                        transparent, 
                        ${colors[colorIndex]}ff, 
                        transparent)`;
                    diagonal.style.boxShadow = `0 0 20px ${colors[colorIndex]}`;
                    
                    // Animation de pulsation
                    diagonal.animate([
                        { opacity: 0.8, boxShadow: `0 0 20px ${colors[colorIndex]}` },
                        { opacity: 0.5, boxShadow: `0 0 10px ${colors[colorIndex]}` },
                        { opacity: 0.8, boxShadow: `0 0 20px ${colors[colorIndex]}` }
                    ], {
                        duration: 3000 + (i * 300),
                        iterations: Infinity,
                        easing: 'ease-in-out'
                    });
                    
                    neonLines.appendChild(diagonal);
                }
            }
            
            // Ajouter un effet de flash périodique pour attirer l'attention
            createFlashEffect();
            
            function createFlashEffect() {
                const flash = document.createElement('div');
                flash.style.position = 'absolute';
                flash.style.top = '0';
                flash.style.left = '0';
                flash.style.width = '100%';
                flash.style.height = '100%';
                flash.style.pointerEvents = 'none';
                flash.style.zIndex = '7';
                flash.style.background = 'transparent';
                flash.style.boxShadow = 'inset 0 0 70px rgba(255, 255, 255, 0)';
                
                // Animation de flash
                flash.animate([
                    { boxShadow: 'inset 0 0 70px rgba(255, 255, 255, 0)' },
                    { boxShadow: 'inset 0 0 70px rgba(255, 255, 255, 0.6)' },
                    { boxShadow: 'inset 0 0 70px rgba(255, 255, 255, 0)' }
                ], {
                    duration: 5000,
                    iterations: Infinity,
                    easing: 'ease-in-out'
                });
                
                neonLines.appendChild(flash);
            }
            
            // Ajouter des bandes larges sur les bords pour renforcer l'épaisseur
            createThickBands();
            
            function createThickBands() {
                const positions = ['top', 'right', 'bottom', 'left'];
                
                positions.forEach((position, index) => {
